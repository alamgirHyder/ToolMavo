# Free test deployment: one Spring Boot service serves Vue and the API.
services:
  - type: web
    name: toolmavo
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: DATABASE_HOST
        fromDatabase:
          name: toolmavo-db
          property: host
      - key: DATABASE_NAME
        fromDatabase:
          name: toolmavo-db
          property: database
      - key: DATABASE_USER
        fromDatabase:
          name: toolmavo-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: toolmavo-db
          property: password
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=65.0 -XX:InitialRAMPercentage=20.0

databases:
  - name: toolmavo-db
    plan: free
    region: oregon
    databaseName: toolmavo
    user: toolmavo
    ipAllowList: []
