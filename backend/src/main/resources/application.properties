spring.application.name=toolmavo
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:toolmavo}}
spring.datasource.username=${DATABASE_USER:toolmavo}
spring.datasource.password=${DATABASE_PASSWORD:toolmavo_local}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.port=${PORT:8080}
server.error.include-message=never
server.tomcat.max-http-form-post-size=1MB
spring.jackson.deserialization.fail-on-unknown-properties=true
