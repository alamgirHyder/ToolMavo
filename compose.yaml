services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: toolmavo
      MYSQL_USER: toolmavo
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER -D toolmavo -e 'SELECT 1' >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
  app:
    build: .
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_NAME: toolmavo
      DB_USER: toolmavo
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  mysql_data:
